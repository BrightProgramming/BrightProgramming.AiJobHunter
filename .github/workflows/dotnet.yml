name: .NET CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore BrightProgramming.AiJobHunter.slnx

      - name: Build solution
        run: dotnet build BrightProgramming.AiJobHunter.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test BrightProgramming.AiJobHunter.slnx --configuration Release --no-build --no-restore
