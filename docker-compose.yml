services:
  postgres:
    image: postgres:17-alpine
    container_name: brightprogramming-aijobhunter-postgres
    environment:
      POSTGRES_DB: aijobhunter
      POSTGRES_USER: aijobhunter
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aijobhunter -d aijobhunter"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: